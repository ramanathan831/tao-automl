[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-tao-automl"
version = "0.1.0"
description = "NVIDIA TAO AutoML — standalone hyperparameter optimization for TAO networks"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

dependencies = [
    "numpy",
    "scikit-learn",
    "scipy",
    "pandas",
    "omegaconf",
    "requests",
    "tao-sdk @ git+ssh://git@gitlab-master.nvidia.com:12051/nvidia-tao-toolkit/tao-sdk.git@arahmed/fix-dataset-injection-gpu-cancel",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
Repository = "https://gitlab-master.nvidia.com/nvidia-tao-toolkit/tao-automl"

[tool.setuptools.packages.find]
where = ["src"]
include = ["tao_automl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]